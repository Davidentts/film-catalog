name: Python checks 🐍

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - "film-catalog-source/**"

jobs:
  run-black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ".python_version"
      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install "black==26.5.1"
      - name: Black ⚫
        run: black ./
