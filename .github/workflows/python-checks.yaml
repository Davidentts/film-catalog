name: Python checks 🐍

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "film-catalog-source/**"

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install "black==26.5.1"
      - name: Black ⚫
        run: black --check --diff ./

      - name: Setup uv 🛠️
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: "true"

      - name: Install the project dependencies 🔗
        run: uv sync --locked --all-extras --dev

      - name: Run ruff --diff 💎
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --diff"
          version-file: "pyproject.toml"

      - name: Run ruff check 💎
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "pyproject.toml"

      - name: Run mypy
        run: uv run mypy film-catalog-source

  run-tests:
    runs-on: ubuntu-latest
    needs:
      - run-checks
    services:
      redis:
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Setup uv 🛠️
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: "true"

      - name: Install the project dependencies 🔗
        run: uv sync --locked --all-extras --dev

      - name: Run python tests
        run: uv run pytest film-catalog-source --cov=film-catalog-source --cov-report=json:coverage.json --cov-report=xml:coverage.xml
        env:
          TESTING: 1
          REDIS_PORT: 6379

      - name: Prepare coverage percentage
        run: |
          export EXTRACTED_COVERAGE=$(python -c 'import json;print(json.load(open("coverage.json"))["totals"]["percent_covered_display"])')
          echo "TOTAL_COVERAGE=$EXTRACTED_COVERAGE" >> $GITHUB_ENV
          echo "### Tests coverage: ${EXTRACTED_COVERAGE}%" >> $GITHUB_STEP_SUMMARY

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 068690473a9474f135896778acc863f0
          filename: coverage.json
          label: Coverage
          message: ${{ env.TOTAL_COVERAGE }}%
          minColorRange: 70
          maxColorRange: 90
          valColorRange: ${{ env.TOTAL_COVERAGE }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !github.event.act }} # skip during local actions testing
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          dry_run: ${{ env.ACT }}
          fail_ci_if_error: 'true'
